services:
  neo4j:
    image: neo4j:5.17-community
    container_name: metal-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4JLABS_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: "512M"
      NEO4J_dbms_memory_heap_initial__size: "512M"
      NEO4J_dbms_memory_heap_max__size: "1G"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  metal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    container_name: metal-app
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j
      METAL_DEBUG: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./dist:/app/dist
      - ./packages:/app/packages
      - ./cli:/app/cli
    restart: unless-stopped

  metal-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    container_name: metal-dev
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j
      METAL_DEBUG: "true"
    ports:
      - "3000:3000"
      - "9229:9229"
    volumes:
      - ..:/app:cached
      - /app/node_modules
    command: pnpm dev
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  default:
    name: metal-network
